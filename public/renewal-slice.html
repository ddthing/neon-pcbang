<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#292435">
  <title>길모퉁이PC방 · 2차 리뉴얼 1차 시안 (Vertical Slice 1)</title>
  <link rel="stylesheet" href="./renewal-slice.css">
  <link rel="stylesheet" href="./renewal-seat-picker.css">
</head>
<body>
  <main class="slice-stage" id="slice-stage" aria-label="길모퉁이PC방 2차 리뉴얼 1차 플레이 시안">
    <canvas id="slice-canvas" width="640" height="360" tabindex="0" aria-label="PC방 시안 월드"></canvas>

    <div class="hud-top-left" id="hud-info">
      <div class="hud-pill">
        <strong>길모퉁이PC방 · 1차 시안</strong>
        <span id="hud-zone">매장 앞 복도</span>
        <span class="sep" aria-hidden="true">|</span>
        <span id="hud-scale">640×360 · 1×</span>
      </div>
      <div class="hud-sub" id="hud-status">WASD/방향키 또는 바닥 클릭으로 이동 · 문 통과·키오스크·좌석 착석 시험</div>
    </div>

    <div class="hud-top-right">
      <button type="button" class="qa-chip" id="btn-hud-collapse" aria-expanded="true" title="조작 바 접기/펼치기">패널 숨기기</button>
    </div>

    <div class="qa-dock" id="qa-dock" role="toolbar" aria-label="1차 시안 검수 조작">
      <button type="button" class="qa-btn" id="btn-demo-entrance">입구 통과</button>
      <button type="button" class="qa-btn" id="btn-kiosk">키오스크 · 좌석도 (M)</button>
      <button type="button" class="qa-btn" id="btn-seat-hall-0">일반석 1 착석</button>
      <button type="button" class="qa-btn" id="btn-seat-hall-1">일반석 2 착석</button>
      <button type="button" class="qa-btn" id="btn-seat-solo-0">1인석 착석</button>
      <button type="button" class="qa-btn" id="btn-stand-up" disabled>일어나기 (E)</button>
      <button type="button" class="qa-btn" id="btn-toggle-tray" aria-pressed="false">배달 쟁반 (B)</button>
      <button type="button" class="qa-btn" id="btn-toggle-overlay" aria-pressed="false">기준선 (G)</button>
    </div>

    <div class="toast" id="slice-toast" role="status" aria-live="polite" hidden></div>
  </main>

  <dialog class="seat-picker" id="seatmap-backdrop" aria-labelledby="seatmap-title">
    <div class="seat-picker-panel">
      <header class="seat-picker-header">
        <h1 id="seatmap-title" tabindex="-1">좌석 선택</h1>
        <button type="button" class="close-btn" id="seatmap-close" aria-label="좌석도 닫기">닫기</button>
      </header>
      <div class="seat-picker-scroll">
        <section class="seat-picker-overview" id="seatmap-overview" aria-labelledby="seatmap-overview-title">
          <div class="seat-picker-overview-header">
            <h2 id="seatmap-overview-title">매장 전체</h2>
            <span>점선은 통로</span>
          </div>
          <div class="seat-plan seat-plan-overview" id="seatmap-board" aria-hidden="true"></div>
          <nav class="seat-picker-groups" id="seatmap-groups" aria-label="좌석 줄과 룸"></nav>
        </section>
        <section id="seatmap-detail" hidden aria-labelledby="seatmap-detail-title">
          <div class="seat-picker-detail-header">
            <button type="button" class="close-btn" id="seatmap-back">← 매장 전체</button>
            <h2 id="seatmap-detail-title"></h2>
          </div>
          <div class="seat-plan seat-plan-detail" id="seatmap-seat-board" role="group" aria-describedby="seatmap-instructions"></div>
          <p class="seat-picker-instructions" id="seatmap-instructions">화살표로 자리 탐색 · Enter로 선택</p>
        </section>
      </div>
      <footer class="seat-picker-footer">
        <div>
          <p class="seat-picker-notice" id="seatmap-notice" role="alert"></p>
          <p class="seat-picker-selection" id="seatmap-selection" role="status">좌석 줄이나 룸을 고르세요.</p>
        </div>
        <div class="seat-picker-actions">
          <button type="button" class="qa-btn" id="seatmap-sim-conflict" aria-pressed="false" hidden>다음 예약 충돌 재현</button>
          <button type="button" class="primary-btn" id="seatmap-confirm" disabled>이 자리로 이동</button>
        </div>
      </footer>
    </div>
  </dialog>

  <script type="module" src="./renewal-slice.js"></script>
</body>
</html>
