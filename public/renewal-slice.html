<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#292435">
  <title>길모퉁이PC방 · 2차 리뉴얼 1차 시안 (Vertical Slice 1)</title>
  <link rel="stylesheet" href="./renewal-slice.css">
</head>
<body>
  <main class="slice-stage" id="slice-stage" aria-label="길모퉁이PC방 2차 리뉴얼 1차 플레이 시안">
    <canvas id="slice-canvas" width="640" height="360" tabindex="0" aria-label="PC방 시안 월드"></canvas>

    <div class="hud-top-left" id="hud-info">
      <div class="hud-pill">
        <strong>길모퉁이PC방 · 1차 시안</strong>
        <span id="hud-zone">매장 앞 복도</span>
        <span class="sep" aria-hidden="true">|</span>
        <span id="hud-scale">640×360 · 1×</span>
      </div>
      <div class="hud-sub" id="hud-status">WASD/방향키 또는 바닥 클릭으로 이동 · 문 통과·키오스크·좌석 착석 시험</div>
    </div>

    <div class="hud-top-right">
      <button type="button" class="qa-chip" id="btn-hud-collapse" aria-expanded="true" title="조작 바 접기/펼치기">패널 숨기기</button>
    </div>

    <div class="qa-dock" id="qa-dock" role="toolbar" aria-label="1차 시안 검수 조작">
      <button type="button" class="qa-btn" id="btn-demo-entrance">입구 통과</button>
      <button type="button" class="qa-btn" id="btn-kiosk">키오스크 · 좌석도 (M)</button>
      <button type="button" class="qa-btn" id="btn-seat-hall-0">일반석 1 착석</button>
      <button type="button" class="qa-btn" id="btn-seat-hall-1">일반석 2 착석</button>
      <button type="button" class="qa-btn" id="btn-seat-solo-0">1인석 착석</button>
      <button type="button" class="qa-btn" id="btn-stand-up" disabled>일어나기 (E)</button>
      <button type="button" class="qa-btn" id="btn-toggle-tray" aria-pressed="false">배달 쟁반 (B)</button>
      <button type="button" class="qa-btn" id="btn-toggle-overlay" aria-pressed="false">기준선 (G)</button>
    </div>

    <div class="toast" id="slice-toast" role="status" aria-live="polite" hidden></div>
  </main>

  <div class="modal-backdrop" id="seatmap-backdrop" hidden>
    <section class="seatmap-modal" role="dialog" aria-modal="true" aria-labelledby="seatmap-title">
      <header class="seatmap-header">
        <div>
          <p class="eyebrow">SHARED LAYOUT DATA · 640×360</p>
          <h1 id="seatmap-title">키오스크 · 공용 좌석도</h1>
        </div>
        <button type="button" class="close-btn" id="seatmap-close" aria-label="좌석도 닫기">닫기 (Esc)</button>
      </header>

      <div class="seatmap-legend" aria-label="좌석 상태 안내">
        <span class="leg"><i class="dot avail"></i>이용 가능</span>
        <span class="leg"><i class="dot sel"></i>선택됨</span>
        <span class="leg"><i class="dot mine"></i>내 자리</span>
        <span class="leg"><i class="dot occ"></i>이용 중</span>
      </div>

      <div class="seatmap-board" id="seatmap-board" role="grid" aria-label="PC방 시안 좌석 배치"></div>

      <footer class="seatmap-footer">
        <div class="seatmap-selection" id="seatmap-selection">자리를 선택하세요 (화살표 이동 · Enter 선택)</div>
        <div class="seatmap-actions">
          <button type="button" class="qa-btn" id="seatmap-sim-conflict">동시선택 충돌 테스트</button>
          <button type="button" class="primary-btn" id="seatmap-confirm" disabled>이 자리로 이동 · 착석</button>
        </div>
      </footer>
    </section>
  </div>

  <script type="module" src="./renewal-slice.js"></script>
</body>
</html>
