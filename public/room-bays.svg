      <use href="#chair" x="1353" y="628" color="#b5b9cc"/><use href="#chair" x="1440" y="628" color="#aec1c1"/>
      <use href="#chair" x="1353" y="715" color="#aec1c1"/><use href="#chair" x="1440" y="715" color="#b5b9cc"/>
      <path d="M1408 491H1417V745H1408Z" fill="#49616a"/>
      <path d="M1411 496H1414V741H1411Z" fill="#93b7bd"/>
