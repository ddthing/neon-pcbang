      <use href="#monitor" x="114" y="322"/>
      <use href="#monitor" x="127" y="406"/>
      <use href="#chair" x="117" y="357" color="#c2c8a7"/>
      <use href="#chair" x="131" y="444" color="#bac9b2"/>
