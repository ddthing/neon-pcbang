name: Deploy Gilmotungi PC Bang

on:
  workflow_dispatch:
  # Deploy updates to the access gate and its verification workflow.
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "lib/invite-gate.ts"
      - "tests/invite-gate.test.mjs"
      - "tests/smoke-live-login.mjs"

permissions:
  contents: read

concurrency:
  group: neon-pcbang-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/invite-gate.test.mjs
      - name: Configure Cloudflare Worker
        run: node scripts/configure-github-worker.mjs
        env:
          NEON_WORKER_NAME: neon-pcbang
          NEON_D1_NAME: neon-pcbang
          NEON_D1_ID: 8d873905-9310-405a-9af2-d9743056bbb2
      - name: Validate administrator secret configuration
        env:
          NEON_ADMIN_PASSWORD: ${{ secrets.NEON_ADMIN_PASSWORD }}
        run: |
          if [ ${#NEON_ADMIN_PASSWORD} -lt 16 ]; then
            echo 'NEON_ADMIN_PASSWORD must be configured as a repository Actions Secret with at least 16 characters.' >&2
            exit 1
          fi
      - name: Apply database migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_ADMIN_PASSWORD: ${{ secrets.NEON_ADMIN_PASSWORD }}
        run: |
          set -o pipefail
          npx --no-install wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
          printf '%s' "$NEON_ADMIN_PASSWORD" | npx --no-install wrangler secret put NEON_ADMIN_PASSWORD --config dist/server/wrangler.json
          existing_secrets="$(npx --no-install wrangler secret list --format json --config dist/server/wrangler.json)"
          has_vault_key="$(printf '%s' "$existing_secrets" | node -e 'const bindings = JSON.parse(require("node:fs").readFileSync(0, "utf8")); console.log(bindings.some(({name}) => name === "NEON_INVITE_VAULT_KEY"));')"
          if [ "$has_vault_key" = false ]; then
            node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))' |
              npx --no-install wrangler secret put NEON_INVITE_VAULT_KEY --config dist/server/wrangler.json
          fi
          npx --no-install wrangler deploy --config dist/server/wrangler.json

      - name: Verify real production login request
        run: node tests/smoke-live-login.mjs
