name: Deploy Gilmotungi PC Bang

on:
  workflow_dispatch:
  # The invitation rollout deploys once when merged; later releases remain manual.
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: neon-pcbang-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/invite-gate.test.mjs
      - name: Configure Cloudflare Worker
        run: node scripts/configure-github-worker.mjs
        env:
          NEON_WORKER_NAME: ${{ vars.NEON_WORKER_NAME }}
          NEON_D1_NAME: ${{ vars.NEON_D1_NAME }}
          NEON_D1_ID: ${{ vars.NEON_D1_ID }}
      - name: Apply database migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_ADMIN_PASSWORD: ${{ secrets.NEON_ADMIN_PASSWORD }}
        run: |
          test ${#NEON_ADMIN_PASSWORD} -ge 16 || (echo 'NEON_ADMIN_PASSWORD must be at least 16 characters' >&2; exit 1)
          npx --no-install wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
          printf '%s' "$NEON_ADMIN_PASSWORD" | npx --no-install wrangler secret put NEON_ADMIN_PASSWORD --config dist/server/wrangler.json
          npx --no-install wrangler deploy --config dist/server/wrangler.json
